<script>
  (function() {
    // Title Character Count Monitor
    const titleInput = document.getElementById('productTitle');
    const titleCounter = document.getElementById('titleCounter');

    if (titleInput && titleCounter) {
      titleInput.addEventListener('input', (e) => {
        const len = e.target.value.length;
        titleCounter.textContent = `${len}/30`;
      });
    }

    // Feature delete interactions
    const bindFeatureDeletes = () => {
      const deleteButtons = document.querySelectorAll('.btn-delete-feature');
      deleteButtons.forEach(btn => {
        btn.onclick = function() {
          const row = this.closest('div');
          if (row) {
            row.remove();
          }
        };
      });
    };
    bindFeatureDeletes();

    // Feature add interaction (max 3)
    const btnAddFeature = document.getElementById('btnAddFeature');
    const featureList = document.getElementById('featureList');

    if (btnAddFeature && featureList) {
      btnAddFeature.addEventListener('click', () => {
        const currentItems = featureList.querySelectorAll('.btn-delete-feature').length;
        if (currentItems >= 3) {
          alert('最多添加 3 条核心卖点');
          return;
        }

        const newRow = document.createElement('div');
        newRow.className = 'flex items-center gap-space-xs bg-surface-container-low rounded-xl px-space-sm py-2 group focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_2px_#ffdbce] transition-all';
        newRow.innerHTML = `
          <span class="w-1.5 h-1.5 rounded-full bg-primary shrink-0"></span>
          <input
            type="text"
            placeholder="填写吸引力卖点..."
            class="flex-1 bg-transparent font-body-sm text-body-sm text-on-surface focus:outline-none"
          />
          <button type="button" class="btn-delete-feature text-on-surface-variant/60 hover:text-error transition-colors p-1" aria-label="删除此条">
            <span class="material-symbols-outlined text-[18px]">close</span>
          </button>
        `;
        featureList.appendChild(newRow);
        bindFeatureDeletes();
      });
    }

    // Replace photo feedback
    const btnReplacePhoto = document.getElementById('btnReplacePhoto');
    if (btnReplacePhoto) {
      btnReplacePhoto.addEventListener('click', () => {
        const img = document.getElementById('previewImage');
        if (img) {
          img.style.opacity = '0.5';
          setTimeout(() => {
            img.style.opacity = '1';
          }, 300);
        }
      });
    }

    // Remove photo feedback
    const btnRemovePhoto = document.getElementById('btnRemovePhoto');
    if (btnRemovePhoto) {
      btnRemovePhoto.addEventListener('click', () => {
        if (confirm('确定要清除当前照片重新上传吗？')) {
          const img = document.getElementById('previewImage');
          if (img) {
            img.parentElement.innerHTML = `
              <div class="flex flex-col items-center justify-center p-8 text-on-surface-variant cursor-pointer">
                <span class="material-symbols-outlined text-[48px] text-primary mb-2">add_photo_alternate</span>
                <span class="font-headline-sm text-headline-sm text-on-surface">点击上传商品主图</span>
                <span class="font-body-sm text-body-sm text-outline mt-1">支持 JPG / PNG，建议居中饱满</span>
              </div>
            `;
          }
        }
      });
    }

    // Next step navigation feedback
    const btnNextStep = document.getElementById('btnNextStep');
    if (btnNextStep) {
      btnNextStep.addEventListener('click', () => {
        const titleVal = titleInput ? titleInput.value.trim() : '';
        if (!titleVal) {
          alert('请先输入商品名称');
          if (titleInput) titleInput.focus();
          return;
        }
        // Proceed to template gallery step
        const templateTab = document.querySelector('nav a[data-path="gallery-templates"]');
        if (templateTab) {
          templateTab.click();
        }
      });
    }
  })();
