name: 功能任务
description: 规划一项可独立开发和验收的功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先描述用户或业务问题，不要只写实现方式。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 功能范围
      description: 列出本任务包含和不包含的内容。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用可测试的条目描述完成条件。
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 技术说明与风险

